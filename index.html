<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPL Live Score</title>
<style>
  :root{
    --bg:#0b1220; --card:#131c31; --line:#223052; --text:#eef2fb; --mute:#93a0bd;
    --accent:#e63946; --live:#ff4d4d; --ok:#3ddc97; --blue:#3b82f6;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f3f5fa; --card:#fff; --line:#dde3f0; --text:#101828; --mute:#5b6783; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Noto Sans Devanagari","Noto Sans JP",sans-serif}
  header{background:linear-gradient(135deg,#0d2a6b,#9b1c2c);color:#fff;padding:18px 16px 0}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}
  header .wrap{padding:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  h1{margin:0;font-size:20px;letter-spacing:.3px}
  .sub{opacity:.85;font-size:12.5px;margin-top:2px}
  .lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:8px;overflow:hidden}
  .lang button{background:transparent;color:#fff;border:0;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
  .lang button.on{background:#fff;color:#0d2a6b;font-weight:600}
  nav{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
  nav button{background:transparent;border:0;color:rgba(255,255,255,.8);padding:10px 14px;font:inherit;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:#fff;border-bottom-color:#fff;font-weight:600}
  main{padding:16px 0 40px}
  .banner{background:#3a2a05;color:#ffd77a;border:1px solid #6d5313;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .meta{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;gap:8px}
  .badge{font-weight:700;letter-spacing:.4px;font-size:11.5px}
  .badge.live{color:var(--live)} .badge.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;animation:p 1.2s infinite}
  .badge.result{color:var(--ok)} .badge.upcoming{color:var(--blue)}
  @keyframes p{50%{opacity:.25}}
  .row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0}
  .team{display:flex;align-items:center;gap:10px;font-weight:600}
  .logo{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text);overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover}
  .score{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}
  .score small{font-weight:500;color:var(--mute);font-size:12.5px;margin-left:4px}
  .status{margin-top:6px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px}
  .status.live{color:var(--live);font-weight:600}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mute);font-size:12px;font-weight:600}
  td.pts{font-weight:700}
  .empty{color:var(--mute);text-align:center;padding:30px 0}
  .foot{color:var(--mute);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1 data-i="title">NPL Live Score</h1>
        <div class="sub" id="series">Nepal Premier League</div>
      </div>
      <div class="lang"><button id="en" class="on">EN</button><button id="ne">नेपाली</button></div>
    </div>
    <nav id="tabs">
      <button data-tab="live" class="on" data-i="live">Live</button>
      <button data-tab="fixtures" data-i="fixtures">Fixtures</button>
      <button data-tab="results" data-i="results">Results</button>
      <button data-tab="table" data-i="table">Points table</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div id="banner"></div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
  <div class="foot"><a href="design.html" style="color:inherit">Design guide</a></div>
</main>

<script>
const I18N = {
  en: {
    title:"NPL Live Score", live:"Live", fixtures:"Fixtures", results:"Results", table:"Points table",
    nolive:"No match is live right now. Check Fixtures for the next game.",
    nofix:"No upcoming matches.", nores:"No results yet.",
    LIVE:"LIVE", UPCOMING:"UPCOMING", RESULT:"RESULT",
    team:"Team", p:"P", w:"W", l:"L", nr:"NR", pts:"Pts",
    note:"Points: 2 for a win, 1 for a tie or no result. Net run rate is not shown.",
    updated:"Updated", error:"Could not load scores. Retrying…", stale:"Showing the last saved scores (the data source is not responding).",
    demo:"Sample data. Add your API key to show real NPL scores.",
    ov:"ov", nolist:"No matches found."
  },
  ne: {
    title:"एनपीएल लाइभ स्कोर", live:"लाइभ", fixtures:"तालिका", results:"नतिजा", table:"अंक तालिका",
    nolive:"अहिले कुनै खेल लाइभ छैन। अर्को खेलका लागि तालिका हेर्नुहोस्।",
    nofix:"आगामी खेल छैन।", nores:"अहिलेसम्म नतिजा छैन।",
    LIVE:"लाइभ", UPCOMING:"आगामी", RESULT:"नतिजा",
    team:"टोली", p:"खे", w:"जि", l:"हा", nr:"नि", pts:"अंक",
    note:"अंक: जितको २, बराबरी वा नतिजा नआए १। नेट रन रेट देखाइएको छैन।",
    updated:"अपडेट", error:"स्कोर लोड भएन। फेरि प्रयास गर्दै…", stale:"पछिल्लो सुरक्षित स्कोर देखाइँदै छ (डेटा स्रोतले जवाफ दिएन)।",
    demo:"नमूना डेटा हो। वास्तविक स्कोरका लागि API key राख्नुहोस्।",
    ov:"ओभर", nolist:"खेल भेटिएन।"
  }
};
let lang = (()=>{try{return localStorage.getItem("lang")||"en"}catch(e){return "en"}})();
let tab = "live", data = null, failed = false;
const t = k => I18N[lang][k] || k;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function teamHTML(tm){
  const logo = tm.img ? `<img src="${esc(tm.img)}" alt="" onerror="this.remove()">` : esc(tm.short.slice(0,3));
  return `<span class="team"><span class="logo">${logo}</span>${esc(tm.name)}</span>`;
}
function scoreFor(m, tm){
  // match an innings line to a team by name
  const s = m.scores.find(x => x.inning && x.inning.toLowerCase().includes(tm.name.toLowerCase()));
  if (!s) return "";
  return `${s.runs}/${s.wickets}<small>(${s.overs} ${t("ov")})</small>`;
}
function when(m){
  const d = new Date(m.start);
  if (isNaN(d)) return "";
  return d.toLocaleString(lang==="ne"?"ne-NP":undefined, {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
}
function card(m){
  const badge = `<span class="badge ${m.state}">${t(m.state.toUpperCase())}</span>`;
  const rows = m.teams.map(tm => `<div class="row">${teamHTML(tm)}<span class="score">${scoreFor(m,tm)}</span></div>`).join("");
  const st = m.state==="upcoming" ? when(m) : m.status;
  return `<div class="card"><div class="meta">${badge}<span>${esc(m.venue)}</span></div>${rows}
    <div class="status ${m.state==="live"?"live":""}">${esc(st)}</div></div>`;
}

function standings(matches){
  const tb = {};
  const get = tm => tb[tm.name] ||= {name:tm.name, short:tm.short, img:tm.img, p:0,w:0,l:0,nr:0,pts:0};
  matches.forEach(m => m.teams.forEach(get));
  matches.filter(m=>m.state==="result").forEach(m=>{
    const [a,b] = m.teams.map(get);
    const s = (m.status||"").toLowerCase();
    const winner = m.teams.find(x => s.startsWith(x.name.toLowerCase()) && /won/.test(s));
    a.p++; b.p++;
    if (winner){
      const w = get(winner), l = winner.name===a.name ? b : a;
      w.w++; w.pts+=2; l.l++;
    } else { a.nr++; b.nr++; a.pts++; b.pts++; }
  });
  return Object.values(tb).sort((x,y)=>y.pts-x.pts || y.w-x.w || x.name.localeCompare(y.name));
}

function render(){
  document.documentElement.lang = lang==="ne" ? "ne" : "en";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab===tab));
  $("#en").classList.toggle("on", lang==="en"); $("#ne").classList.toggle("on", lang==="ne");
  document.title = t("title");

  let banner = "";
  if (data && data.demo) banner += `<div class="banner">${t("demo")}</div>`;
  if (data && data.stale) banner += `<div class="banner">${t("stale")}</div>`;
  if (failed && !data) banner += `<div class="banner">${t("error")}</div>`;
  $("#banner").innerHTML = banner;
  if (!data){ $("#view").innerHTML = ""; return; }
  $("#series").textContent = data.series || "Nepal Premier League";

  const ms = data.matches || [];
  let html = "";
  if (tab==="live"){
    const l = ms.filter(m=>m.state==="live");
    html = l.length ? l.map(card).join("") : `<div class="empty">${t("nolive")}</div>`;
  } else if (tab==="fixtures"){
    const l = ms.filter(m=>m.state==="upcoming").sort((a,b)=>new Date(a.start)-new Date(b.start));
    html = l.length ? l.map(card).join("") : `<div class="empty">${t("nofix")}</div>`;
  } else if (tab==="results"){
    const l = ms.filter(m=>m.state==="result").sort((a,b)=>new Date(b.start)-new Date(a.start));
    html = l.length ? l.map(card).join("") : `<div class="empty">${t("nores")}</div>`;
  } else {
    const rows = standings(ms);
    html = rows.length ? `<div class="card"><table><thead><tr><th>${t("team")}</th><th>${t("p")}</th><th>${t("w")}</th><th>${t("l")}</th><th>${t("nr")}</th><th>${t("pts")}</th></tr></thead><tbody>`
      + rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.nr}</td><td class="pts">${r.pts}</td></tr>`).join("")
      + `</tbody></table></div><div class="foot">${t("note")}</div>` : `<div class="empty">${t("nolist")}</div>`;
  }
  $("#view").innerHTML = html;
  $("#foot").textContent = data.updated ? `${t("updated")}: ${new Date(data.updated).toLocaleTimeString()}` : "";
}

// Sample data, used only when the server is not reachable (e.g. index.html opened directly).
function sampleData(){
  const h = x => new Date(Date.now() + x*3600e3).toISOString();
  const T = {
    SUD:{name:"Sudurpaschim Royals",short:"SUD"}, CHI:{name:"Chitwan Rhinos",short:"CHI"},
    BIR:{name:"Biratnagar Kings",short:"BIR"}, JAN:{name:"Janakpur Bolts",short:"JAN"}
  };
  const mk = (id,a,b,state,hrs,status,scores) => ({id, name:T[a].name+" vs "+T[b].name, state, status,
    venue:"TU Cricket Ground, Kirtipur", start:h(hrs), teams:[T[a],T[b]], scores});
  return { demo:true, series:"Nepal Premier League (SAMPLE DATA)", updated:new Date().toISOString(), matches:[
    mk("d1","SUD","CHI","result",-26,"Sudurpaschim Royals won by 5 wickets",
      [{inning:"Chitwan Rhinos Inning 1",runs:151,wickets:8,overs:20},{inning:"Sudurpaschim Royals Inning 1",runs:152,wickets:5,overs:18.4}]),
    mk("d2","BIR","JAN","live",-1.2,"Biratnagar Kings need 41 runs from 30 balls",
      [{inning:"Janakpur Bolts Inning 1",runs:168,wickets:7,overs:20},{inning:"Biratnagar Kings Inning 1",runs:128,wickets:4,overs:15}]),
    mk("d3","CHI","BIR","upcoming",22,"Match not started",[]),
    mk("d4","JAN","SUD","upcoming",46,"Match not started",[])
  ]};
}

async function load(){
  try{
    const r = await fetch("/api/matches", {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    data = await r.json(); failed = false;
  }catch(e){
    failed = true;
    if (!data) data = sampleData();   // no server: show sample data instead of an empty page
  }
  render();
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$("#en").onclick = () => setLang("en"); $("#ne").onclick = () => setLang("ne");
function setLang(l){ lang = l; try{localStorage.setItem("lang", l)}catch(e){} render(); }

render(); load();
setInterval(load, 30000);               // refresh every 30 s
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
