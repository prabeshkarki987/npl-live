<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2a6b">
<title>NPL Live Score</title>
<style>
  :root{
    --bg:#0a1020; --card:#131c31; --card2:#18233d; --line:#233156; --text:#eef2fb; --mute:#93a0bd;
    --live:#ff5a5a; --ok:#3ddc97; --blue:#4c8dff; --shadow:0 6px 18px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f2f5fb; --card:#ffffff; --card2:#f5f8fe; --line:#dce3f1; --text:#0f172a; --mute:#566280;
      --live:#d92d2d; --ok:#0f9d63; --blue:#2563eb; --shadow:0 6px 18px rgba(20,40,90,.10);
    }
  }
  :root[data-theme="light"]{
    --bg:#f2f5fb; --card:#ffffff; --card2:#f5f8fe; --line:#dce3f1; --text:#0f172a; --mute:#566280;
    --live:#d92d2d; --ok:#0f9d63; --blue:#2563eb; --shadow:0 6px 18px rgba(20,40,90,.10);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Sans Devanagari","Noto Sans JP",sans-serif}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px}

  header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#0d2a6b 0%,#6b1d4a 55%,#9b1c2c 100%);color:#fff;box-shadow:0 2px 14px rgba(0,0,0,.3)}
  header .wrap{padding-top:14px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  h1{margin:0;font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  h1 .ball{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a7a,#c01f2f 60%,#7a0f1a);position:relative;flex:none}
  h1 .ball::after{content:"";position:absolute;left:3px;right:3px;top:50%;border-top:1.5px dashed rgba(255,255,255,.8);transform:rotate(-20deg)}
  .sub{opacity:.85;font-size:12.5px;margin-top:1px}
  .ctrls{display:flex;gap:8px;align-items:center}
  .iconbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;width:34px;height:32px;border-radius:9px;cursor:pointer;font-size:15px}
  .iconbtn:hover{background:rgba(255,255,255,.25)}
  .lang{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:9px;overflow:hidden}
  .lang button{background:transparent;color:#fff;border:0;padding:6px 10px;font-size:13px;cursor:pointer}
  .lang button.on{background:#fff;color:#0d2a6b;font-weight:700}
  nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{background:transparent;border:0;color:rgba(255,255,255,.78);padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav button.on{color:#fff;border-bottom-color:#fff;font-weight:700}
  nav button .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:rgba(255,255,255,.22);font-size:11px;line-height:18px}

  main{padding:16px 0 44px}
  .banner{background:rgba(255,196,60,.12);color:#d9a21a;border:1px solid rgba(255,196,60,.45);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:13px}
  @media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .banner{color:#8a5a00}}
  :root[data-theme="light"] .banner{color:#8a5a00}

  .card{display:block;position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px 20px;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;animation:rise .35s ease both}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--c1),var(--c2))}
  a.card{transition:transform .15s ease, border-color .15s ease}
  a.card:hover{transform:translateY(-2px);border-color:var(--blue)}
  a.card:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .meta{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;gap:8px}
  .meta .v{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-weight:800;letter-spacing:.5px;font-size:11.5px}
  .badge.live{color:var(--live)} .badge.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--live);margin-right:6px;animation:p 1.2s infinite}
  .badge.result{color:var(--ok)} .badge.upcoming{color:var(--blue)}
  @keyframes p{50%{opacity:.25;transform:scale(.8)}}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:10px}
  .team{display:flex;align-items:center;gap:10px;font-weight:650;min-width:0}
  .team span.nm{overflow:hidden;text-overflow:ellipsis}
  .logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;overflow:hidden;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
  .logo img{width:100%;height:100%;object-fit:cover;background:#fff}
  .score{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;white-space:nowrap}
  .score small{font-weight:500;color:var(--mute);font-size:12.5px;margin-left:4px}
  .status{margin-top:4px;padding-top:9px;border-top:1px dashed var(--line);font-size:13.5px;display:flex;justify-content:space-between;gap:8px}
  .status.live{color:var(--live);font-weight:650}
  .status .more{color:var(--blue);font-weight:600;white-space:nowrap}

  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--mute);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  td.pts{font-weight:800}
  tr:last-child td{border-bottom:0}
  .tw{overflow-x:auto}
  .tw table{min-width:0}
  .tw th,.tw td{padding:9px 4px;font-size:13.5px}
  .tw th:first-child,.tw td:first-child{padding-left:2px}
  td.pl{min-width:0;word-break:break-word}
  .card.plain{padding:12px 14px;animation:none}
  .card.plain::before{display:none}
  .rank{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card2);font-size:11.5px;font-weight:800;margin-right:8px;color:var(--mute)}
  tr:first-child .rank{background:var(--ok);color:#fff}
  .empty{color:var(--mute);text-align:center;padding:36px 0}
  .foot{color:var(--mute);font-size:12px;text-align:center;margin-top:18px}
  .foot a{text-decoration:underline}

  /* details */
  .back{background:transparent;border:0;color:var(--blue);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:6px}
  .hero{padding:16px 16px 14px 20px}
  .hero .row{padding:10px 0}
  .hero .score{font-size:24px}
  .info{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-top:8px}
  .info dt{color:var(--mute)} .info dd{margin:0}
  .seg{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;scrollbar-width:none}
  .seg button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-size:13.5px}
  .seg button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  h3{margin:14px 2px 6px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
  td.pl{text-align:left}
  td.pl small{display:block;color:var(--mute);font-size:12px;font-weight:400}
  td.pl b{font-weight:650}
  td.r{font-weight:800}

  .sk{background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:16px;height:118px;margin-bottom:12px;border:1px solid var(--line)}
  @keyframes sh{to{background-position:-200% 0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div>
        <h1><span class="ball"></span><span data-i="title">NPL Live Score</span></h1>
        <div class="sub" id="series">Nepal Premier League</div>
      </div>
      <div class="ctrls">
        <button class="iconbtn" id="themeBtn" title="Theme" aria-label="Toggle light and dark theme">◐</button>
        <div class="lang"><button id="en" class="on">EN</button><button id="ne">नेपाली</button></div>
      </div>
    </div>
    <nav id="tabs">
      <button data-tab="live" class="on"><span data-i="live">Live</span><span class="n" id="n-live">0</span></button>
      <button data-tab="fixtures"><span data-i="fixtures">Fixtures</span></button>
      <button data-tab="results"><span data-i="results">Results</span></button>
      <button data-tab="table"><span data-i="table">Points table</span></button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div id="banner"></div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
  <div class="foot"><a href="design.html" data-i="guide">Design guide</a></div>
</main>

<script>
const I18N = {
  en: {
    title:"NPL Live Score", live:"Live", fixtures:"Fixtures", results:"Results", table:"Points table", guide:"Design guide",
    nolive:"No match is live right now. Check Fixtures for the next game.",
    nofix:"No upcoming matches.", nores:"No results yet.",
    LIVE:"LIVE", UPCOMING:"UPCOMING", RESULT:"RESULT",
    team:"Team", p:"P", w:"W", l:"L", nr:"NR", pts:"Pts",
    note:"Points: 2 for a win, 1 for a tie or no result. Net run rate is not shown.",
    updated:"Updated", error:"Could not load scores. Retrying…", stale:"Showing the last saved scores (the data source is not responding).",
    demo:"Sample data. Add your API key to show real NPL scores.",
    ov:"ov", nolist:"No matches found.",
    back:"← Back", details:"Details", scorecard:"Scorecard", venue:"Venue", date:"Date", toss:"Toss", resultL:"Result",
    batter:"Batter", bowler:"Bowler", r:"R", b:"B", f4:"4s", f6:"6s", sr:"SR", o:"O", m:"M", wk:"W", eco:"Econ",
    batting:"Batting", bowling:"Bowling", nocard:"The scorecard is not available yet. It appears once the match starts.",
    cardfail:"Could not load the scorecard. Try again in a moment.", view:"View scorecard →", notstarted:"Match not started"
  },
  ne: {
    title:"एनपीएल लाइभ स्कोर", live:"लाइभ", fixtures:"तालिका", results:"नतिजा", table:"अंक तालिका", guide:"डिजाइन गाइड",
    nolive:"अहिले कुनै खेल लाइभ छैन। अर्को खेलका लागि तालिका हेर्नुहोस्।",
    nofix:"आगामी खेल छैन।", nores:"अहिलेसम्म नतिजा छैन।",
    LIVE:"लाइभ", UPCOMING:"आगामी", RESULT:"नतिजा",
    team:"टोली", p:"खे", w:"जि", l:"हा", nr:"नि", pts:"अंक",
    note:"अंक: जितको २, बराबरी वा नतिजा नआए १। नेट रन रेट देखाइएको छैन।",
    updated:"अपडेट", error:"स्कोर लोड भएन। फेरि प्रयास गर्दै…", stale:"पछिल्लो सुरक्षित स्कोर देखाइँदै छ (डेटा स्रोतले जवाफ दिएन)।",
    demo:"नमूना डेटा हो। वास्तविक स्कोरका लागि API key राख्नुहोस्।",
    ov:"ओभर", nolist:"खेल भेटिएन।",
    back:"← फर्कनुहोस्", details:"विवरण", scorecard:"स्कोरकार्ड", venue:"स्थान", date:"मिति", toss:"टस", resultL:"नतिजा",
    batter:"ब्याटर", bowler:"बोलर", r:"रन", b:"बल", f4:"४", f6:"६", sr:"SR", o:"ओ", m:"मे", wk:"विकेट", eco:"इकोन",
    batting:"ब्याटिङ", bowling:"बलिङ", nocard:"स्कोरकार्ड अहिले उपलब्ध छैन। खेल सुरु भएपछि देखिन्छ।",
    cardfail:"स्कोरकार्ड लोड भएन। केही बेरपछि फेरि प्रयास गर्नुहोस्।", view:"स्कोरकार्ड हेर्नुहोस् →", notstarted:"खेल सुरु भएको छैन"
  }
};
const safe = (k,v) => { try{ return localStorage.getItem(k) || v }catch(e){ return v } };
const save = (k,v) => { try{ localStorage.setItem(k,v) }catch(e){} };

let lang = safe("lang","en");
let theme = safe("theme","");           // "", "light" or "dark"
let tab = "live", data = null, failed = false;
let card = null, cardId = null, cardState = "idle", inn = 0; // details view
const t = k => I18N[lang][k] || k;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- helpers ---------- */
function hue(name){ let h=0; for(const ch of String(name)) h=(h*31+ch.charCodeAt(0))%360; return h; }
function tcol(name, l=42){ return `hsl(${hue(name)} 62% ${l}%)`; }
function logo(tm){
  const inner = tm.img ? `<img src="${esc(tm.img)}" alt="" onerror="this.remove()">` : esc((tm.short||tm.name).slice(0,3));
  return `<span class="logo" style="background:linear-gradient(135deg,${tcol(tm.name,48)},${tcol(tm.name,30)})">${inner}</span>`;
}
function teamHTML(tm){ return `<span class="team">${logo(tm)}<span class="nm">${esc(tm.name)}</span></span>`; }
function scoreFor(m, tm){
  const s = (m.scores||[]).find(x => x.inning && x.inning.toLowerCase().includes(tm.name.toLowerCase()));
  return s ? `${s.runs}/${s.wickets}<small>(${s.overs} ${t("ov")})</small>` : "";
}
function when(iso, full){
  const d = new Date(iso); if (isNaN(d)) return "";
  const o = full ? {weekday:"short", day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}
                 : {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"};
  return d.toLocaleString(lang==="ne"?"ne-NP":undefined, o);
}
function colors(m){
  const a = m.teams[0] ? tcol(m.teams[0].name,48) : "#888", b = m.teams[1] ? tcol(m.teams[1].name,48) : "#888";
  return `--c1:${a};--c2:${b}`;
}

/* ---------- list cards ---------- */
function matchCard(m, i){
  const badge = `<span class="badge ${m.state}">${t(m.state.toUpperCase())}</span>`;
  const rows = m.teams.map(tm => `<div class="row">${teamHTML(tm)}<span class="score">${scoreFor(m,tm)}</span></div>`).join("");
  const st = m.state==="upcoming" ? when(m.start) : m.status;
  const more = m.state==="upcoming" ? "" : `<span class="more">${t("view")}</span>`;
  return `<a class="card" href="#/match/${encodeURIComponent(m.id)}" style="${colors(m)};animation-delay:${Math.min(i,8)*40}ms">
    <div class="meta">${badge}<span class="v">${esc(m.venue)}</span></div>${rows}
    <div class="status ${m.state==="live"?"live":""}"><span>${esc(st)}</span>${more}</div></a>`;
}

/* ---------- points table ---------- */
function standings(matches){
  const tb = {};
  const get = tm => tb[tm.name] ||= {name:tm.name, short:tm.short, img:tm.img, p:0,w:0,l:0,nr:0,pts:0};
  matches.forEach(m => m.teams.forEach(get));
  matches.filter(m=>m.state==="result").forEach(m=>{
    const [a,b] = m.teams.map(get);
    const s = (m.status||"").toLowerCase();
    const winner = m.teams.find(x => s.startsWith(x.name.toLowerCase()) && /won/.test(s));
    a.p++; b.p++;
    if (winner){ const w = get(winner), l = winner.name===a.name ? b : a; w.w++; w.pts+=2; l.l++; }
    else { a.nr++; b.nr++; a.pts++; b.pts++; }
  });
  return Object.values(tb).sort((x,y)=>y.pts-x.pts || y.w-x.w || x.name.localeCompare(y.name));
}

/* ---------- details view ---------- */
function detailsHTML(id){
  const m = (data && data.matches || []).find(x => String(x.id)===String(id));
  let html = `<button class="back" id="backBtn">${t("back")}</button>`;
  if (m){
    const rows = m.teams.map(tm => `<div class="row">${teamHTML(tm)}<span class="score">${scoreFor(m,tm)}</span></div>`).join("");
    html += `<div class="card hero" style="${colors(m)}"><div class="meta"><span class="badge ${m.state}">${t(m.state.toUpperCase())}</span><span class="v">${esc(m.venue)}</span></div>
      ${rows}<div class="status ${m.state==="live"?"live":""}"><span>${esc(m.state==="upcoming" ? when(m.start,true) : m.status)}</span></div></div>`;
  }
  if (cardState==="loading" && !card){ return html + `<div class="sk"></div><div class="sk"></div>`; }
  if (cardState==="error" && !card){ return html + `<div class="empty">${t("cardfail")}</div>`; }
  if (!card){ return html; }

  const info = [];
  if (card.venue) info.push([t("venue"), card.venue]);
  if (card.date)  info.push([t("date"), when(card.date,true)]);
  if (card.toss)  info.push([t("toss"), card.toss]);
  if (card.winner) info.push([t("resultL"), card.winner]);
  if (info.length) html += `<div class="card plain"><dl class="info">${info.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`;

  const innings = card.innings || [];
  if (!innings.length){ return html + `<div class="empty">${t("nocard")}</div>`; }
  if (inn >= innings.length) inn = 0;
  html += `<div class="seg" role="tablist">${innings.map((x,i)=>`<button role="tab" data-inn="${i}" class="${i===inn?"on":""}">${esc(x.name || ("Innings "+(i+1)))}</button>`).join("")}</div>`;
  const cur = innings[inn];
  if (cur.batting.length){
    html += `<h3>${t("batting")}</h3><div class="card plain tw"><table><thead><tr><th>${t("batter")}</th><th>${t("r")}</th><th>${t("b")}</th><th>${t("f4")}</th><th>${t("f6")}</th><th>${t("sr")}</th></tr></thead><tbody>`
      + cur.batting.map(b=>`<tr><td class="pl"><b>${esc(b.name)}</b><small>${esc(b.out)}</small></td><td class="r">${esc(b.r)}</td><td>${esc(b.b)}</td><td>${esc(b.fours)}</td><td>${esc(b.sixes)}</td><td>${esc(b.sr)}</td></tr>`).join("")
      + `</tbody></table></div>`;
  }
  if (cur.bowling.length){
    html += `<h3>${t("bowling")}</h3><div class="card plain tw"><table><thead><tr><th>${t("bowler")}</th><th>${t("o")}</th><th>${t("m")}</th><th>${t("r")}</th><th>${t("wk")}</th><th>${t("eco")}</th></tr></thead><tbody>`
      + cur.bowling.map(b=>`<tr><td class="pl"><b>${esc(b.name)}</b></td><td>${esc(b.o)}</td><td>${esc(b.m)}</td><td>${esc(b.r)}</td><td class="r">${esc(b.w)}</td><td>${esc(b.eco)}</td></tr>`).join("")
      + `</tbody></table></div>`;
  }
  return html;
}

/* ---------- render ---------- */
function route(){ const m = location.hash.match(/^#\/match\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; }

function render(){
  document.documentElement.lang = lang==="ne" ? "ne" : "en";
  if (theme) document.documentElement.setAttribute("data-theme", theme); else document.documentElement.removeAttribute("data-theme");
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab===tab));
  $("#en").classList.toggle("on", lang==="en"); $("#ne").classList.toggle("on", lang==="ne");
  document.title = t("title");

  let banner = "";
  if (data && data.demo) banner += `<div class="banner">${t("demo")}</div>`;
  if (data && data.stale) banner += `<div class="banner">${t("stale")}</div>`;
  if (failed && !data) banner += `<div class="banner">${t("error")}</div>`;
  $("#banner").innerHTML = banner;

  if (!data){ $("#view").innerHTML = `<div class="sk"></div><div class="sk"></div>`; return; }
  $("#series").textContent = data.series || "Nepal Premier League";
  const ms = data.matches || [];
  $("#n-live").textContent = ms.filter(m=>m.state==="live").length;
  $("#n-live").style.display = ms.some(m=>m.state==="live") ? "" : "none";

  const id = route();
  let html = "";
  if (id){
    html = detailsHTML(id);
  } else if (tab==="live"){
    const l = ms.filter(m=>m.state==="live");
    html = l.length ? l.map(matchCard).join("") : `<div class="empty">${t("nolive")}</div>`;
  } else if (tab==="fixtures"){
    const l = ms.filter(m=>m.state==="upcoming").sort((a,b)=>new Date(a.start)-new Date(b.start));
    html = l.length ? l.map(matchCard).join("") : `<div class="empty">${t("nofix")}</div>`;
  } else if (tab==="results"){
    const l = ms.filter(m=>m.state==="result").sort((a,b)=>new Date(b.start)-new Date(a.start));
    html = l.length ? l.map(matchCard).join("") : `<div class="empty">${t("nores")}</div>`;
  } else {
    const rows = standings(ms);
    html = rows.length ? `<div class="card plain tw"><table><thead><tr><th>${t("team")}</th><th>${t("p")}</th><th>${t("w")}</th><th>${t("l")}</th><th>${t("nr")}</th><th>${t("pts")}</th></tr></thead><tbody>`
      + rows.map((r,i)=>`<tr><td><span class="rank">${i+1}</span>${esc(r.name)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.nr}</td><td class="pts">${r.pts}</td></tr>`).join("")
      + `</tbody></table></div><div class="foot">${t("note")}</div>` : `<div class="empty">${t("nolist")}</div>`;
  }
  $("#view").innerHTML = html;
  $("#foot").textContent = data.updated ? `${t("updated")}: ${new Date(data.updated).toLocaleTimeString()}` : "";
}

/* ---------- data ---------- */
function sampleData(){
  const h = x => new Date(Date.now() + x*3600e3).toISOString();
  const T = { SUD:{name:"Sudurpaschim Royals",short:"SUD"}, CHI:{name:"Chitwan Rhinos",short:"CHI"}, BIR:{name:"Biratnagar Kings",short:"BIR"}, JAN:{name:"Janakpur Bolts",short:"JAN"} };
  const mk = (id,a,b,state,hrs,status,scores) => ({id, name:T[a].name+" vs "+T[b].name, state, status, venue:"TU Cricket Ground, Kirtipur", start:h(hrs), teams:[T[a],T[b]], scores});
  return { demo:true, series:"Nepal Premier League (SAMPLE DATA)", updated:new Date().toISOString(), matches:[
    mk("d1","SUD","CHI","result",-26,"Sudurpaschim Royals won by 5 wickets",[{inning:"Chitwan Rhinos Inning 1",runs:151,wickets:8,overs:20},{inning:"Sudurpaschim Royals Inning 1",runs:152,wickets:5,overs:18.4}]),
    mk("d2","BIR","JAN","live",-1.2,"Biratnagar Kings need 41 runs from 30 balls",[{inning:"Janakpur Bolts Inning 1",runs:168,wickets:7,overs:20},{inning:"Biratnagar Kings Inning 1",runs:128,wickets:4,overs:15}]),
    mk("d3","CHI","BIR","upcoming",22,"Match not started",[]),
    mk("d4","JAN","SUD","upcoming",46,"Match not started",[])
  ]};
}
async function load(){
  try{
    const r = await fetch("/api/matches", {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    data = await r.json(); failed = false;
  }catch(e){ failed = true; if (!data) data = sampleData(); }
  render();
}
async function loadCard(id, quiet){
  if (!quiet){ card = null; cardState = "loading"; inn = 0; render(); }
  try{
    const r = await fetch("/api/match?id=" + encodeURIComponent(id), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    card = await r.json(); cardState = "ok";
  }catch(e){
    cardState = "error";
    // opened as a plain file (no server): show a sample scorecard
    if (data && data.demo) { card = sampleCard(); cardState = "ok"; }
  }
  if (route()===id) render();
}
function sampleCard(){
  const bat=(n,o,r,b,f,s)=>({name:"Batter "+n,out:o,r,b,fours:f,sixes:s,sr:+(r/b*100).toFixed(2)});
  const bowl=(n,o,r,w)=>({name:"Bowler "+n,o,m:0,r,w,eco:+(r/o).toFixed(2)});
  return {venue:"TU Cricket Ground, Kirtipur", toss:"Toss: sample data", winner:"", innings:[
    {name:"Janakpur Bolts Inning 1", batting:[bat(1,"c Fielder 3 b Bowler 1",42,31,5,2),bat(2,"lbw b Bowler 2",28,22,3,1),bat(3,"not out",55,38,4,3)], bowling:[bowl(1,4,31,2),bowl(2,4,36,1)]},
    {name:"Biratnagar Kings Inning 1", batting:[bat(1,"c Fielder 1 b Bowler 4",37,26,4,2),bat(2,"not out",48,33,5,1)], bowling:[bowl(4,4,29,2),bowl(5,3,27,1)]}
  ]};
}

/* ---------- events ---------- */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  if (route()) location.hash = ""; else render();
  window.scrollTo({top:0});
});
$("#en").onclick = () => { lang="en"; save("lang",lang); render(); };
$("#ne").onclick = () => { lang="ne"; save("lang",lang); render(); };
$("#themeBtn").onclick = () => {
  const dark = theme ? theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  theme = dark ? "light" : "dark"; save("theme", theme); render();
};
$("#view").addEventListener("click", e => {
  if (e.target.closest("#backBtn")){ e.preventDefault(); if (history.length>1 && location.hash) history.back(); else location.hash = ""; return; }
  const seg = e.target.closest("[data-inn]");
  if (seg){ inn = +seg.dataset.inn; render(); }
});
window.addEventListener("hashchange", () => {
  const id = route();
  if (id){ cardId = id; loadCard(id); window.scrollTo({top:0}); } else { card = null; cardId = null; render(); }
});

render(); load();
if (route()){ cardId = route(); loadCard(cardId); }
setInterval(() => { load(); if (route()) loadCard(route(), true); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ load(); if (route()) loadCard(route(), true); } });
</script>
